<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>بوبو فت — Booboo Fit</title>
  <meta name="description" content="برنامجك ٤ أيام — صدر · رِجل أمامي · ظهر · رِجل خلفي. سجّلي أوزانك وتابعي تقدّمك." />

  <meta name="theme-color" content="#0E0E12" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="بوبو فت" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" href="./icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

  <!-- Active screen is rendered here by ui.js -->
  <main id="screen" class="screen"></main>

  <!-- Bottom navigation -->
  <nav id="tabbar" class="tabbar" role="tablist" aria-label="التنقّل">
    <button class="navbtn is-active" data-nav="home" role="tab" aria-selected="true">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>الرئيسية</span>
    </button>
    <button class="navbtn" data-nav="workout" role="tab" aria-selected="false">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8.5" width="3.6" height="7" rx="1.2"/><rect x="17.9" y="8.5" width="3.6" height="7" rx="1.2"/><path d="M6.1 12h11.8"/><path d="M6.3 10.4v3.2M17.7 10.4v3.2"/></svg>
      <span>التمرين</span>
    </button>
    <button class="navbtn" data-nav="progress" role="tab" aria-selected="false">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M4 20V4"/><path d="M7 15l4-4 3 2 5-6"/></svg>
      <span>تقدّمي</span>
    </button>
    <button class="navbtn" data-nav="account" role="tab" aria-selected="false">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="4"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
      <span>حسابي</span>
    </button>
  </nav>

  <!-- Exercise detail (full screen), populated by ui.js -->
  <section id="exScreen" class="exscreen" hidden></section>

  <!-- Rest-timer sheet -->
  <div id="sheetOverlay" class="overlay" hidden></div>
  <section id="timerSheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet__grab" aria-hidden="true"></div>
    <div class="sheet__head">
      <h2 id="sheetTitle">مؤقّت الراحة</h2>
      <button id="sheetClose" class="iconbtn" type="button" aria-label="إغلاق">✕</button>
    </div>
    <div class="timer">
      <div id="timerDisplay" class="timer__display">01:30</div>
      <div class="timer__presets">
        <button class="chip-btn" data-seconds="60" type="button">٦٠ ث</button>
        <button class="chip-btn is-active" data-seconds="90" type="button">٩٠ ث</button>
        <button class="chip-btn" data-seconds="120" type="button">١٢٠ ث</button>
      </div>
      <div class="timer__controls">
        <button id="timerToggle" class="btn btn--primary" type="button"></button>
        <button id="timerReset" class="btn btn--ghost" type="button">صفّري</button>
      </div>
    </div>
  </section>

  <!-- Login modal -->
  <div id="loginOverlay" class="overlay" hidden></div>
  <section id="loginSheet" class="modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle" hidden>
    <div class="sheet__head">
      <h2 id="loginTitle">تسجيل الدخول</h2>
      <button id="loginClose" class="iconbtn" type="button" aria-label="إغلاق">✕</button>
    </div>
    <form id="loginForm" class="login">
      <p class="modal__hint">سجّلي الدخول عشان يتحفظ وزنك وعداتك بالسحابة وتشوفينه على أي جهاز</p>
      <label class="field__label" for="loginEmail">الإيميل</label>
      <input id="loginEmail" class="field" type="email" inputmode="email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" placeholder="you@email.com" dir="ltr" required>
      <label class="field__label" for="loginPass">كلمة المرور</label>
      <input id="loginPass" class="field" type="password" autocomplete="current-password" enterkeyhint="done" placeholder="••••••••" minlength="6" dir="ltr" required>
      <p id="loginError" class="login__error" role="alert"></p>
      <button id="loginSubmit" class="btn btn--primary login__submit" type="submit">دخول</button>
      <button id="loginToggle" class="linkbtn" type="button">ما عندك حساب؟ أنشئي واحد</button>
    </form>
  </section>

  <!-- History modal -->
  <div id="historyOverlay" class="overlay" hidden></div>
  <section id="historySheet" class="modal" role="dialog" aria-modal="true" aria-labelledby="historyTitle" hidden>
    <div class="sheet__head">
      <h2 id="historyTitle">السجل</h2>
      <button id="historyClose" class="iconbtn" type="button" aria-label="إغلاق">✕</button>
    </div>
    <div id="historyBody" class="history"></div>
  </section>

  <!-- Confetti layer -->
  <div id="celebrate" class="celebrate" aria-hidden="true"></div>

  <script src="./js/config.js" defer></script>
  <script src="./js/store.js" defer></script>
  <script src="./js/app.js" defer></script>
  <script src="./js/ui.js" defer></script>
</body>
</html>
